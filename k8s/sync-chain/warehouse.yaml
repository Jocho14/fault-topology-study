apiVersion: apps/v1
kind: Deployment
metadata:
  name: warehouse
  labels:
    app: warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: warehouse
  template:
    metadata:
      labels:
        app: warehouse
    spec:
      containers:
        - name: warehouse
          image: warehouse-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
            - containerPort: 50052
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic
                  key: license-key
            - name: NEW_RELIC_APP_NAME
              value: warehouse-sync-chain
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: PORT
              value: "3002"
            - name: GRPC_PORT
              value: "50052"
            - name: TOPOLOGY
              value: sync-chain
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/warehouse_db
            - name: PAYMENT_GRPC
              value: payment:50053

---
apiVersion: v1
kind: Service
metadata:
  name: warehouse
spec:
  selector:
    app: warehouse
  ports:
    - name: http
      port: 3002
      targetPort: 3002
    - name: grpc
      port: 50052
      targetPort: 50052
