apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels:
    app: payment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: payment-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3003
            - containerPort: 50053
          env:
            - name: PORT
              value: "3003"
            - name: GRPC_PORT
              value: "50053"
            - name: TOPOLOGY
              value: sync-chain
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/payment_db
            - name: DELIVERY_GRPC
              value: delivery:50054

---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 3003
      targetPort: 3003
    - name: grpc
      port: 50053
      targetPort: 50053
