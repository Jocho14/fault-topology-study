apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  labels:
    app: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: shop-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
            - containerPort: 50051
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic
                  key: license-key
            - name: NEW_RELIC_APP_NAME
              value: shop-async-event
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: PORT
              value: "3001"
            - name: GRPC_PORT
              value: "50051"
            - name: TOPOLOGY
              value: async-event
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/shop_db
            - name: WAREHOUSE_GRPC
              value: warehouse:50052
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672

---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - name: http
      port: 3001
      targetPort: 3001
    - name: grpc
      port: 50051
      targetPort: 50051
