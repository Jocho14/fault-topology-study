apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  labels:
    app: delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      containers:
        - name: delivery
          image: delivery-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3004
            - containerPort: 50054
          env:
            - name: PORT
              value: "3004"
            - name: GRPC_PORT
              value: "50054"
            - name: TOPOLOGY
              value: async-event
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/delivery_db
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672

---
apiVersion: v1
kind: Service
metadata:
  name: delivery
spec:
  selector:
    app: delivery
  ports:
    - name: http
      port: 3004
      targetPort: 3004
    - name: grpc
      port: 50054
      targetPort: 50054
