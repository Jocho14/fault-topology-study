apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    app: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: orchestrator-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3005
          env:
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic
                  key: license-key
            - name: NEW_RELIC_APP_NAME
              value: orchestrator-sync-orchestrator
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_NO_CONFIG_FILE
              value: "true"
            - name: PORT
              value: "3005"
            - name: SHOP_GRPC
              value: shop:50051
            - name: WAREHOUSE_GRPC
              value: warehouse:50052
            - name: PAYMENT_GRPC
              value: payment:50053
            - name: DELIVERY_GRPC
              value: delivery:50054

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  selector:
    app: orchestrator
  ports:
    - name: http
      port: 3005
      targetPort: 3005
